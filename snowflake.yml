# Snowflake CLI project definition. Drives `snow app run` (dev-mode install/upgrade)
# and `snow app version create` (versioned release). Field reference:
# https://docs.snowflake.com/en/developer-guide/snowflake-cli/native-apps/project-definitions
#
# Validated live 2026-09-12 against a fresh trial account (`snow` CLI 3.1.0):
# parses cleanly and the package/stage naming below (listening_lens_pkg,
# app_src.stage) matches what `snow app run` actually created. One fix needed
# after a live error: the application entity's `debug` field, see below.

definition_version: 2

entities:
  listening_lens_pkg:
    type: application package
    identifier: listening_lens_pkg
    manifest: app/manifest.yml
    artifacts:
      - src: app/*
        dest: ./
      - src: streamlit/*
        dest: streamlit/
      - src: data/listening_history.csv
        dest: data/listening_history.csv

  listening_lens_app:
    type: application
    identifier: listening_lens_app
    from:
      target: listening_lens_pkg
    # `debug` defaults to true (per the CLI's project-definition docs), but a
    # manifest_version: 2 app rejects debug mode outright: confirmed live
    # 2026-09-12 via `snow app run` erroring with "Cannot use debug mode on an
    # application when manifest version is 2 or above. Please use session
    # debugging." Must be explicit false, not just omitted, since the default
    # is true.
    debug: false
