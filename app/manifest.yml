# Native App manifest. Field reference:
# https://docs.snowflake.com/en/developer-guide/native-apps/manifest-reference
#
# Paths below are relative to this file's own location once deployed (app/*
# lands at the deploy root, per snowflake.yml).

manifest_version: 2

artifacts:
  setup_script: setup_script.sql
  readme: README.md
  # Points at the schema.object the setup script creates with CREATE STREAMLIT,
  # not a file path. See setup_script.sql.
  default_streamlit: core.listening_lens_streamlit

# Confirmed 2026-09-12 against Snowflake's own manifest reference doc
# (https://docs.snowflake.com/en/developer-guide/native-apps/manifest-reference#snowflake_database-field),
# which gives this exact block as its own worked example for CORTEX_USER.
# This is a separate mechanism from the `privileges` block below (which is for
# privileges in the CONSUMER's account); `snowflake_database.roles` requests a
# database/application role that lives in Snowflake's own SNOWFLAKE database,
# reviewed and granted by the consumer the same way as account privileges.
# Still to be confirmed live: whether this alone is sufficient, or whether
# Cortex COMPLETE also needs IMPORTED PRIVILEGES ON DATABASE SNOWFLAKE granted
# some other way; test against the trial account once `snow app run` installs.
snowflake_database:
  roles:
    - CORTEX_USER:
        description: 'Required to call Snowflake Cortex AI functions from the Discover tab.'

# No `privileges` block yet, left out entirely rather than set to an empty
# list, since I'm not certain an empty list is valid here and omitting an
# optional field is the safer guess. This app is self-contained (own schema,
# own bundled data, one external call to Cortex), so there may genuinely be
# nothing to ask the consumer for beyond what CREATE APPLICATION already
# grants implicitly. Revisit once FR-6 (the optional reference to a consumer's
# own table) is built; that needs its own `references` block, not added here
# yet since it's Phase 2 (P1), not part of this core-demo pass.
